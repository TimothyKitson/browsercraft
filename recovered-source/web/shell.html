<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxel Game</title>
<meta name="description" content="A voxel sandbox game running in your browser.">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #151920;
    --text: #e8ecf1;
    --muted: #9aa5b1;
    --accent: #6cc24a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #canvas {
    display: block; width: 100vw; height: 100vh;
    background: #0b0d10; outline: none; border: 0;
  }
  /* Loading / start overlay */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 35%, #1b2330 0%, #0b0d10 70%);
    z-index: 10; text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 52px); letter-spacing: 2px; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 44ch; }
  #bar {
    width: min(360px, 80vw); height: 8px; border-radius: 4px;
    background: #222a35; overflow: hidden;
  }
  #fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }
  #play {
    margin-top: 6px; padding: 14px 34px; font: inherit; font-size: 16px; letter-spacing: 1px;
    color: #0b0d10; background: var(--accent); border: 0; border-radius: 6px;
    cursor: pointer; display: none;
  }
  #play:hover { filter: brightness(1.1); }
  kbd {
    background: var(--panel); border: 1px solid #2a323d; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 12px; color: var(--text);
  }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="overlay">
  <h1>VOXEL GAME</h1>
  <p id="status">Loading…</p>
  <div id="bar"><div id="fill"></div></div>
  <button id="play">PLAY</button>
  <p>
    <kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sneak &nbsp; <kbd>Ctrl</kbd> sprint<br>
    <kbd>Click</kbd> mine &nbsp; <kbd>Right click</kbd> place &nbsp; <kbd>1-9</kbd> hotbar &nbsp; <kbd>E</kbd> inventory<br>
    <kbd>F</kbd> fly &nbsp; <kbd>G</kbd> creative &nbsp; <kbd>F3</kbd> debug &nbsp; <kbd>Esc</kbd> release mouse
  </p>
</div>

<script type="text/javascript">
  const overlay = document.getElementById('overlay');
  const statusText = document.getElementById('status');
  const fill = document.getElementById('fill');
  const playButton = document.getElementById('play');
  const canvas = document.getElementById('canvas');

  // The canvas has to match its on-screen size in device pixels or the
  // picture comes out blurry on high-DPI displays.
  function resizeCanvas() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * ratio);
    canvas.height = Math.floor(window.innerHeight * ratio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var Module = {
    canvas: canvas,
    arguments: [],
    preRun: [],
    postRun: [],
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
    setStatus: function (text) {
      const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (match) {
        const done = parseFloat(match[2]);
        const total = parseFloat(match[4]);
        fill.style.width = (done / total * 100) + '%';
        statusText.textContent = 'Downloading world data…';
      } else if (text) {
        statusText.textContent = text;
      } else {
        // Empty status means loading finished.
        fill.style.width = '100%';
        statusText.textContent = 'Ready';
        playButton.style.display = 'inline-block';
      }
    },
    onRuntimeInitialized: function () {
      fill.style.width = '100%';
      statusText.textContent = 'Ready';
      playButton.style.display = 'inline-block';
    }
  };

  playButton.addEventListener('click', function () {
    overlay.classList.add('hidden');
    canvas.focus();
    // Pointer lock must be requested from a user gesture.
    if (canvas.requestPointerLock) canvas.requestPointerLock();
  });

  // Clicking the canvas after Esc re-captures the mouse.
  canvas.addEventListener('click', function () {
    if (!document.pointerLockElement && overlay.classList.contains('hidden')) {
      canvas.requestPointerLock();
    }
  });

  // Don't let the browser scroll or quick-find while playing.
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','/',"'"].includes(e.key)) {
      if (document.pointerLockElement) e.preventDefault();
    }
  }, { passive: false });
</script>
{{{ SCRIPT }}}
</body>
</html>
