<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Browsercraft</title>
<meta name="description" content="A block-building sandbox that runs entirely in your browser.">
<meta name="theme-color" content="#0b0d10">
<style>
  :root { --bg:#0b0d10; --text:#e8ecf1; --muted:#9aa5b1; --accent:#6cc24a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #canvas { display:block; width:100vw; height:100vh; background:var(--bg); outline:0; border:0; touch-action:none; }

  /* A thin loading strip, not a gate: it covers the canvas only until the
     runtime is up, then gets out of the way so the game's own menu is the
     first thing anyone sees. */
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:14px; background:radial-gradient(circle at 50% 40%, #1b2330 0, #0b0d10 70%); z-index:10; padding:24px; }
  #boot[hidden] { display:none !important; }
  h1 { margin:0; font-size:clamp(22px,5vw,40px); letter-spacing:2px; }
  #status { margin:0; color:var(--muted); font-size:13px; min-height:1.3em; }
  #bar { width:min(340px,78vw); height:7px; border-radius:4px; background:#222a35; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--accent); transition:width .2s ease; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<div id="boot">
  <h1>BROWSERCRAFT</h1>
  <p id="status">Loading&hellip;</p>
  <div id="bar"><div id="fill"></div></div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var boot = document.getElementById('boot');
  var statusText = document.getElementById('status');
  var fill = document.getElementById('fill');

  function start() {
    if (boot.hidden) return;
    fill.style.width = '100%';
    boot.hidden = true;
    canvas.focus();
  }

  // Browsers will not start audio until the page has been interacted with, so
  // resume it on the first click rather than demanding one up front.
  function resumeAudio() {
    try {
      var ctx = window.Module && window.Module.SDL2 && window.Module.SDL2.audioContext;
      if (ctx && ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* the game runs silent if this fails */ }
  }
  window.addEventListener('pointerdown', resumeAudio, true);

  window.Module = {
    canvas: canvas,
    arguments: [],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      var m = t && t.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        fill.style.width = (parseFloat(m[2]) / parseFloat(m[4])) * 100 + '%';
        statusText.textContent = 'Loading world data…';
      } else if (t) {
        statusText.textContent = t;
      } else {
        start();
      }
    },
    onRuntimeInitialized: start
  };

  window.addEventListener('unhandledrejection', function (e) {
    var msg = String((e.reason && e.reason.message) || e.reason || '');
    if (/pointer lock/i.test(msg)) e.preventDefault();
  });

  window.addEventListener('keydown', function (e) {
    if (document.pointerLockElement &&
        ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','/',"'"].indexOf(e.key) >= 0) {
      e.preventDefault();
    }
  }, { passive:false });

  if (!window.WebAssembly) {
    statusText.textContent = 'This browser has no WebAssembly support.';
    document.getElementById('bar').hidden = true;
    return;
  }
  try {
    var probe = document.createElement('canvas');
    if (!window.WebGL2RenderingContext || !probe.getContext('webgl2')) {
      statusText.innerHTML = 'This browser cannot run Browsercraft.<br>It needs WebGL2 &mdash; try Chrome, Edge, Firefox or Safari 15+.';
      document.getElementById('bar').hidden = true;
      window.Module.setStatus = function () {};
      window.Module.onRuntimeInitialized = function () {};
    }
  } catch (e) { /* let the loader try regardless */ }
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
