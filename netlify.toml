# Netlify configuration for browsercraft.net.
#
# This is the file Netlify reads when the site is connected to the Git
# repository. There is a second copy inside dist/ for the other way of
# deploying -- dragging that folder onto Netlify by hand -- because a
# dropped folder is the site root and never sees this file.
#
# No build command: Netlify's builders have no Emscripten toolchain, so
# the WebAssembly bundle is built locally with tools/build-web.ps1 and
# the dist/ folder is committed.

[build]
  publish = "dist"
  command = ""

# WebAssembly has to arrive as application/wasm or the browser refuses to
# stream-compile it and falls back to a slower path -- or fails outright.
[[headers]]
  for = "/index.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# The asset bundle and the glue script are content-hashed by the build in
# practice (they change together with the wasm), so they cache hard too.
[[headers]]
  for = "/index.data"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must never be cached, or players keep loading an old
# build after a redeploy and nothing you ship ever reaches them.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# WebAssembly threads would need these two, and they are deliberately off.
# Turning them on without a pthreads build gains nothing and blocks every
# third-party embed; the browser build is single-threaded on purpose.
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Cross-Origin-Opener-Policy = "same-origin"
#     Cross-Origin-Embedder-Policy = "require-corp"
