# Netlify configuration for Browsercraft.
#
# The site is a prebuilt WebAssembly bundle, so there is no build command --
# upload the dist/ folder produced by tools/build-web.ps1.

[build]
  publish = "."

# WebAssembly must be served as application/wasm or the browser refuses to
# stream-compile it. Netlify usually gets this right, but being explicit
# costs nothing.
[[headers]]
  for = "/index.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.data"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must never be cached, otherwise players keep getting an
# old build after you redeploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Enabling WebAssembly threads needs these two headers, which is exactly
# what GitHub Pages and itch.io cannot provide. Uncomment them *and*
# rebuild with pthreads enabled -- turning them on without a threaded
# build just blocks third-party embeds for no benefit.
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Cross-Origin-Opener-Policy = "same-origin"
#     Cross-Origin-Embedder-Policy = "require-corp"
